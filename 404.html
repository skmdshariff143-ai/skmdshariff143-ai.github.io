<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found | Shaik Mahammad Shariff</title>



    <!-- Google Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Outfit:wght@500;700&display=swap" rel="stylesheet">



    <style>

        :root {

            --bg-main: #0a0a0a;

            --accent-teal: #00e5ff;

            --text-main: #e0e0e0;

            --text-muted: #888888;

        }



        body {

            margin: 0;

            padding: 0;

            background-color: var(--bg-main);

            color: var(--text-main);

            font-family: 'Inter', sans-serif;

            display: flex;

            align-items: center;

            justify-content: center;

            min-height: 100vh;

            text-align: center;

        }



        .container {

            max-width: 600px;

            padding: 2rem;

        }



        h1 {

            font-family: 'Outfit', sans-serif;

            font-size: 8rem;

            margin: 0;

            color: var(--accent-teal);

            line-height: 1;

            text-shadow: 0 0 20px rgba(0, 229, 255, 0.2);

        }



        h2 {

            font-family: 'Outfit', sans-serif;

            font-size: 2rem;

            margin: 1rem 0;

            color: var(--text-main);

        }



        p {

            color: var(--text-muted);

            font-size: 1.1rem;

            margin-bottom: 2.5rem;

            line-height: 1.6;

        }



        .btn {

            display: inline-block;

            padding: 12px 30px;

            background-color: transparent;

            color: var(--accent-teal);

            text-decoration: none;

            font-family: 'Outfit', sans-serif;

            font-size: 1.1rem;

            font-weight: 500;

            border: 1px solid var(--accent-teal);

            border-radius: 4px;

            transition: all 0.3s ease;

            box-shadow: 0 0 10px rgba(0, 229, 255, 0.1);

        }



        .btn:hover {

            background-color: var(--accent-teal);

            color: var(--bg-main);

            box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);

            transform: translateY(-2px);

        }

    </style>

</head>

<body>

    <div class="container">

        <h1>404</h1>

        <h2>Page Not Found</h2>

        <p>The page you are looking for doesn't exist or has been moved.</p>

        <a href="/" class="btn">Return to Portfolio</a>

    </div>

</body>

</html>
